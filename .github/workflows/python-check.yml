name: Python syntax check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Install web-tier dependencies
        run: python -m pip install -r web-tier/requirements-lock.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Verify web-tier imports
        run: python -c "import flask, boto3; print('Web-tier imports passed')"

      - name: Test worker coordination without AWS
        run: python -m unittest discover -s tests -v
